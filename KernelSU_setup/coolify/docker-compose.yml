services:
  redroid14:
    # Pinned ReDroid 14 image from the previously validated deployment.
    image: redroid/redroid@sha256:0a611199ba2e0b5d60af39b3327a517f6407231f4352114ed3bd3cbfe2be69aa
    # Docker container IDs/names change during Coolify deployments. Keep the
    # Android/Linux hostname and Docker DNS identities stable instead.
    hostname: redroid14-ksu
    privileged: true
    # Isolate Android netd's cgroup/socket BPF program and UID permission map.
    # This requires the host to boot with unified cgroup v2; private namespaces
    # alone do not isolate the Android-created hierarchy on a cgroup-v1 host.
    # Without both pieces, a second ReDroid can replace this instance's program
    # and deny sockets for colliding app IDs (socket(AF_INET6, ...) = EPERM).
    cgroup: private
    # Preserve service availability across Docker/Coolify and VPS restarts.
    # Resource and PID limits still contain a failed Android workload.
    # /data below preserves every module and app file. If a container-only
    # restart loses LSPosed, the guarded host recovery service reboots once.
    restart: unless-stopped
    cpus: 1.5
    mem_limit: 8g
    memswap_limit: 10g
    pids_limit: 8192
    stop_grace_period: 10s
    ports:
      # The malware that previously occupied 5555 has been removed. Keep real
      # Android adbd on its standard ReDroid port for Docker/API reachability.
      # Public firewall restriction is intentionally deferred.
      #
      # This published port IS the API's path to ADB: dw-fast-api SSH-tunnels to
      # the VPS host and connects to the host's own 127.0.0.1:5555. It replaced
      # the old shared `redroid-persistent` bridge, on which the API addressed
      # this container by the `redroid14` alias. That bridge is gone, so Android
      # now boots with a single interface (the Coolify-injected network as eth0)
      # and the dual-network attachment race in network-fix.md cannot occur.
      - "5555:5555"
    volumes:
      # The host preparation script creates these BinderFS nodes before deployment.
      - /dev/binderfs/binder:/dev/binder
      - /dev/binderfs/hwbinder:/dev/hwbinder
      - /dev/binderfs/vndbinder:/dev/vndbinder
      # Never give Android the host kernel log device.
      - /dev/null:/dev/kmsg
      # Persistent Android data, KernelSU daemon, and installed modules.
      - type: bind
        source: /home/ubuntu/redroid14-data
        target: /data
        bind:
          create_host_path: true
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "2"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test "$(getprop sys.boot_completed)" = 1 &&
          test "$(getprop init.svc.adbd)" = running &&
          pidof adbd >/dev/null
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 5m
    command:
      - androidboot.redroid_gpu_mode=guest
      - androidboot.use_memfd=1
      # Guest/software rendering otherwise defaults to a visibly choppy 15 Hz.
      # Keep the existing 720p geometry and use a conservative 24 Hz ceiling
      # for this two-core Ampere host.
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1280
      - androidboot.redroid_dpi=320
      - androidboot.redroid_fps=24
      - net.hostname=redroid14-ksu
      - service.adb.tcp.port=5555
      - ro.secure=0
      - ro.debuggable=1
