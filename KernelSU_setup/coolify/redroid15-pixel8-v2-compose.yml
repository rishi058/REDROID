name: redroid15-pixel8-v2

services:
  redroid:
    image: local/redroid15-pixel8-v1:latest
    container_name: redroid15-pixel8-v2
    privileged: true
    restart: unless-stopped
    cpus: 1.0
    security_opt:
      - label=disable
    ports:
      - "127.0.0.1:5559:5555"
    volumes:
      - /home/Rishi/redroid15-pixel8-v2-data:/data
      - /dev/binderfs-v2/binder:/dev/binder
      - /dev/binderfs-v2/hwbinder:/dev/hwbinder
      - /dev/binderfs-v2/vndbinder:/dev/vndbinder
      - /dev/null:/dev/kmsg
    command:
      - androidboot.redroid_gpu_mode=guest
      - androidboot.use_memfd=1
      - ro.secure=0
      - ro.debuggable=1
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1280
      - androidboot.redroid_dpi=320
