services:
  redroid14:
    image: redroid/redroid:14.0.0-latest
    container_name: redroid14
    privileged: true
    restart: unless-stopped
    ports:
      - "5555:5555"
    volumes:
      - redroid14-data:/data
      - /dev/binderfs:/dev/binderfs
    command:
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1280
      - androidboot.redroid_dpi=320

volumes:
  redroid14-data: